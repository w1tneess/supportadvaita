name: Build and Verify Deployment

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Least privilege by default; jobs opt in to anything more
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify Production Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Third-party actions pinned to full commit SHAs (tags are mutable)
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Vite static assets
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/404.html || exit 1
          test -f dist/favicon.svg || exit 1
          test -f dist/og-image.png || exit 1
          test -f dist/_headers || exit 1
          # Local-only test page must never ship
          test ! -f dist/upi-test.html || { echo "dist/upi-test.html must not be deployed"; exit 1; }
          # Sitemap must not start with a UTF-8 BOM
          test "$(head -c 3 dist/sitemap.xml | od -An -tx1 | tr -d ' ')" != "efbbbf" || { echo "sitemap.xml has a BOM"; exit 1; }
          echo "Production build verified successfully!"

      # The deploy job ships exactly this verified bundle; it never rebuilds
      - name: Upload verified bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scope the Cloudflare secrets to a protected environment (Settings → Environments → production)
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      # Installs the lockfile-pinned wrangler only; the site itself is not rebuilt here
      - run: npm ci
      - name: Download verified bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Confirm the bundle is the verified one
        run: |
          test -f dist/index.html && test -f dist/404.html && test -f dist/_headers || { echo "Downloaded bundle is incomplete"; exit 1; }
      - name: Deploy (skipped when secrets are not configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No Cloudflare secrets; skipping deploy"; exit 0; fi
          npx wrangler pages deploy dist --project-name=supportadvaita --branch=master
