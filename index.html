    <!-- Instant Theme Detection Script (Zero FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('paytoadvaita_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || ((!saved || saved === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#FBFBFD] dark:bg-[#0C0B0A] text-[#1D1D1F] dark:text-[#F8F6F0] antialiased selection:bg-[#C2956A]/20 selection:text-[#C2956A] min-h-dvh transition-colors duration-200">
