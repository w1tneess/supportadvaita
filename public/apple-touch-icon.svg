<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1816" />
      <stop offset="50%" stop-color="#12110F" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D7B6" />
      <stop offset="50%" stop-color="#C2956A" />
      <stop offset="100%" stop-color="#9E7247" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Background -->
  <rect width="180" height="180" fill="url(#appleBg)" />
  
  <!-- Subtle Hardware Rim -->
  <rect x="4" y="4" width="172" height="172" rx="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />
  
  <!-- Concentric Inner Circle -->
  <circle cx="90" cy="90" r="64" stroke="url(#goldGradient)" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Stylized Indian Rupee Glyph -->
  <g filter="url(#subtleGlow)">
    <path d="M60 56h60" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" />
    <path d="M60 74h45" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" />
    <path d="M78 56v42c0 10 7.5 15 21 15l18 27" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M78 56c21 0 33 6 33 19.5s-12 19.5-33 19.5" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" />
    <circle cx="123" cy="59" r="5" fill="url(#goldGradient)" />
  </g>
</svg>
